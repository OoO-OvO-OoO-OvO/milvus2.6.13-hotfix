name: Backport Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag for the backport image
        required: true
        default: 2.6.13-bp1
      push_to_ghcr:
        description: Push the built image to GHCR
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 20480
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare shell scripts
        shell: bash
        run: |
          pwd
          ls -la
          ls -la build
          sed -i 's/\r$//' Makefile .env docker-compose.yml
          find build scripts -type f \( -name '*.sh' -o -name 'builder.sh' \) -print0 | xargs -0 sed -i 's/\r$//'
          find build scripts -type f \( -name '*.sh' -o -name 'builder.sh' \) -print0 | xargs -0 chmod +x
          find build/docker -type f \( -name 'Dockerfile' -o -name 'Dockerfile.*' \) -print0 | xargs -0 sed -i 's/\r$//'
          chmod +x build/docker/builder/entrypoint.sh

      - name: Prepare image name
        id: prep
        shell: bash
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${owner}/milvus" >> "$GITHUB_OUTPUT"

      - name: Verify workspace
        shell: bash
        run: |
          pwd
          ls -la
          ls -la build
          test -f ./build/builder.sh
          test -f ./build/build_image.sh

      - name: Build milvus artifacts
        shell: bash
        run: bash ./build/builder.sh /bin/bash -lc "make install"

      - name: Upload milvus binary
        uses: actions/upload-artifact@v4
        with:
          name: milvus-bin-${{ inputs.image_tag }}
          path: bin/milvus
          if-no-files-found: error

      - name: Log in to GHCR
        if: ${{ inputs.push_to_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime image
        shell: bash
        env:
          MILVUS_IMAGE_REPO: ${{ steps.prep.outputs.image_name }}
          MILVUS_IMAGE_TAG: ${{ inputs.image_tag }}
        run: bash ./build/build_image.sh

      - name: Push runtime image
        if: ${{ inputs.push_to_ghcr }}
        run: docker push "${{ steps.prep.outputs.image_name }}:${{ inputs.image_tag }}"

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Backport Image"
            echo
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Image: \`${{ steps.prep.outputs.image_name }}:${{ inputs.image_tag }}\`"
            echo "- Pushed: \`${{ inputs.push_to_ghcr }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
