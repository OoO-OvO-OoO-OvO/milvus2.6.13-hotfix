name: Backport Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag for the backport image
        required: true
        default: 2.6.13-bp1
      push_to_ghcr:
        description: Push the built image to GHCR
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 20480
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"

      - name: Prepare image name
        id: prep
        shell: bash
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${owner}/milvus" >> "$GITHUB_OUTPUT"

      - name: Build milvus binary
        run: ./build/builder.sh make milvus

      - name: Upload milvus binary
        uses: actions/upload-artifact@v4
        with:
          name: milvus-bin-${{ inputs.image_tag }}
          path: bin/milvus
          if-no-files-found: error

      - name: Log in to GHCR
        if: ${{ inputs.push_to_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime image
        shell: bash
        run: |
          docker build \
            -f Dockerfile.backport-2.6.13 \
            -t "${{ steps.prep.outputs.image_name }}:${{ inputs.image_tag }}" \
            .

      - name: Push runtime image
        if: ${{ inputs.push_to_ghcr }}
        run: docker push "${{ steps.prep.outputs.image_name }}:${{ inputs.image_tag }}"

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Backport Image"
            echo
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Image: \`${{ steps.prep.outputs.image_name }}:${{ inputs.image_tag }}\`"
            echo "- Pushed: \`${{ inputs.push_to_ghcr }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
